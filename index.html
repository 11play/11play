    <style>
        .apk-install-popup {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;

            z-index: 99999;

            display: none;

            padding:
                0
                10px;

            pointer-events: none;
        }

        .apk-install-popup.show {
            display: block;

            pointer-events: auto;
        }

        .apk-popup-box {
            position: relative;

            width: 100%;
            max-width: 680px;

            margin: 0 auto;

            overflow: hidden;

            border-radius:
                20px
                20px
                0
                0;

            background:
                rgba(255, 255, 255, 0.94);

            box-shadow:
                0 -8px 35px
                rgba(0, 0, 0, 0.35);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            animation:
                apk-popup-up
                0.35s
                ease;
        }

        @keyframes apk-popup-up {
            from {
                opacity: 0;

                transform:
                    translateY(100%);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .apk-popup-bg {
            position: absolute;
            inset: 0;

            background:
                url("assets/icon/11web-192.png")
                center /
                cover
                no-repeat;

            opacity: 0.14;

            filter:
                blur(6px);

            transform:
                scale(1.15);
        }

        .apk-popup-content {
            position: relative;

            z-index: 2;

            padding:
                12px
                14px;
        }

        .apk-popup-close {
            position: absolute;
            top: 10px;
            right: 10px;

            z-index: 5;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.35);

            color: #ffffff;

            font-size: 30px;
            line-height: 38px;

            text-align: center;

            cursor: pointer;
        }

        .apk-popup-head {
            display: flex;
            align-items: center;

            gap: 10px;

            padding-right: 42px;
        }

        .apk-popup-icon {
            width: 72px;
            height: 72px;

            flex-shrink: 0;

            border-radius: 16px;

            object-fit: cover;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.25);
        }

        .apk-popup-title {
            min-width: 0;

            flex: 1;

            color: #000000;

            font-size: 20px;
            font-weight: 900;
            line-height: 1.2;

            overflow-wrap: break-word;

            text-shadow:
                0 1px 2px
                rgba(255, 255, 255, 0.7);
        }

        .apk-popup-divider {
            width: 100%;
            height: 2px;

            margin:
                10px
                0;

            background:
                rgba(0, 0, 0, 0.15);
        }

        .apk-download-btn {
            width: 70%;
            max-width: 380px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding:
                12px
                16px;

            border-radius: 14px;

            background: #168bff;

            color: #ffffff;

            font-size: 24px;
            font-weight: 800;

            text-decoration: none;

            box-shadow:
                0 8px 22px
                rgba(22, 139, 255, 0.45);
        }

        .apk-download-btn span {
            font-size: 26px;
        }

        .admin-dashboard-entry-link {
            width: calc(100% - 24px);
            min-height: 44px;

            margin:
                10px
                12px;

            display: flex;
            align-items: center;

            gap: 11px;

            padding:
                10px
                13px;

            border:
                1px solid
                rgba(37, 99, 235, 0.22);

            border-radius: 10px;

            background:
                rgba(37, 99, 235, 0.08);

            color: inherit;

            font-weight: 700;

            text-decoration: none;
        }

        .admin-dashboard-entry-link:hover {
            background:
                rgba(37, 99, 235, 0.14);
        }

        .admin-dashboard-entry-link-icon {
            width: 24px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;
        }

        @media (max-width: 480px) {
            .apk-popup-content {
                padding:
                    10px
                    12px;
            }

            .apk-popup-icon {
                width: 66px;
                height: 66px;
            }

            .apk-popup-title {
                font-size: 18px;
                line-height: 1.25;
            }

            .apk-download-btn {
                width: 74%;

                padding:
                    12px
                    14px;

                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .apk-popup-box {
                animation: none;
            }
        }
    </style>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            () => {
                "use strict";

                const appRoot =
                    document.getElementById(
                        "app-root"
                    );

                const appLoader =
                    document.getElementById(
                        "app-loader"
                    );

                let appShown =
                    false;

                let apkPopupInitialized =
                    false;

                /* =========================================
                   APK POPUP
                ========================================== */

                function setApkPopupVisible(
                    visible
                ) {
                    const popup =
                        document.getElementById(
                            "apkInstallPopup"
                        );

                    if (!popup) {
                        return;
                    }

                    popup.classList.toggle(
                        "show",
                        visible
                    );

                    popup.setAttribute(
                        "aria-hidden",
                        visible
                            ? "false"
                            : "true"
                    );
                }

                function showApkPopup() {
                    window.setTimeout(
                        () => {
                            setApkPopupVisible(
                                true
                            );
                        },
                        700
                    );
                }

                function setupApkPopup() {
                    if (
                        apkPopupInitialized
                    ) {
                        return;
                    }

                    const closeButton =
                        document.getElementById(
                            "apkPopupClose"
                        );

                    if (!closeButton) {
                        return;
                    }

                    apkPopupInitialized =
                        true;

                    closeButton.addEventListener(
                        "click",
                        () => {
                            setApkPopupVisible(
                                false
                            );
                        }
                    );

                    document.addEventListener(
                        "keydown",
                        (event) => {
                            if (
                                event.key ===
                                "Escape"
                            ) {
                                setApkPopupVisible(
                                    false
                                );
                            }
                        }
                    );
                }

                /* =========================================
                   FIRST RENDER
                ========================================== */

                function waitForFirstRenderReady() {
                    return new Promise(
                        (resolve) => {
                            let finished =
                                false;

                            let timer =
                                null;

                            const finish =
                                () => {
                                    if (finished) {
                                        return;
                                    }

                                    finished =
                                        true;

                                    window.removeEventListener(
                                        "APP_FIRST_RENDER_READY",
                                        handleReady
                                    );

                                    if (timer) {
                                        window.clearTimeout(
                                            timer
                                        );
                                    }

                                    resolve();
                                };

                            const handleReady =
                                () => {
                                    finish();
                                };

                            window.addEventListener(
                                "APP_FIRST_RENDER_READY",
                                handleReady,
                                {
                                    once:
                                        true
                                }
                            );

                            timer =
                                window.setTimeout(
                                    finish,
                                    4500
                                );
                        }
                    );
                }

                /* =========================================
                   SHOW APPLICATION
                ========================================== */

                function showApp() {
                    if (appShown) {
                        return;
                    }

                    appShown =
                        true;

                    if (appRoot) {
                        appRoot.hidden =
                            false;
                    }

                    if (appLoader) {
                        appLoader.classList
                            .add(
                                "hide"
                            );

                        window.setTimeout(
                            () => {
                                appLoader.remove();
                            },
                            300
                        );
                    }

                    document.body
                        .classList
                        .remove(
                            "app-booting"
                        );

                    setupApkPopup();
                    showApkPopup();
                }

                /* =========================================
                   ACCOUNT BACKGROUND INITIALIZATION
                ========================================== */

                async function initializeAccountService(
                    name,
                    initializer
                ) {
                    try {
                        await Promise.resolve()
                            .then(
                                initializer
                            );

                        return true;
                    } catch (error) {
                        console.error(
                            `❌ ${name} INIT ERROR:`,
                            error
                        );

                        return false;
                    }
                }

                async function startProfileSystem() {
                    /*
                     * Historical FunctionsClient name is kept
                     * for compatibility. It now uses direct
                     * Firebase Auth/Firestore operations.
                     */

                    await initializeAccountService(
                        "FIRESTORE COMPAT CLIENT",
                        () =>
                            window.FunctionsClient
                                ?.init?.()
                    );

                    await initializeAccountService(
                        "REFERRAL CAPTURE",
                        () =>
                            window.ReferralCapture
                                ?.init?.()
                    );

                    try {
                        await window.AuthService
                            ?.init?.();
                    } catch (error) {
                        console.error(
                            "❌ AUTH SERVICE INIT ERROR:",
                            error
                        );
                    }

                    await initializeAccountService(
                        "AuthGuard",
                        () =>
                            window.AuthGuard
                                ?.init?.()
                    );

                    await initializeAccountService(
                        "ProfileDB",
                        () =>
                            window.ProfileDB
                                ?.init?.()
                    );

                    await initializeAccountService(
                        "ReferralDB",
                        () =>
                            window.ReferralDB
                                ?.init?.()
                    );

                    await initializeAccountService(
                        "ActivityDB",
                        () =>
                            window.ActivityDB
                                ?.init?.()
                    );
                }

                /* =========================================
                   APPLICATION BOOT
                ========================================== */

                async function boot() {
                    console.log(
                        "🚀 BOOT START"
                    );

                    try {
                        /*
                         * Account services initialize in the
                         * background so the existing visual boot
                         * and first-render timing remain unchanged.
                         */

                        void startProfileSystem();

                        window.State
                            ?.init?.();

                        window.Events
                            ?.init?.();

                        window.Utils
                            ?.init?.();

                        window.Shell
                            ?.init?.();

                        window.Menu
                            ?.init?.();

                        const firstRenderReady =
                            waitForFirstRenderReady();

                        window.Router
                            ?.init?.();

                        await firstRenderReady;

                        showApp();

                        console.log(
                            "✅ BOOT DONE"
                        );
                    } catch (error) {
                        console.error(
                            "❌ BOOT ERROR:",
                            error
                        );

                        showApp();
                    }
                }

                window.requestAnimationFrame(
                    () => {
                        void boot();
                    }
                );
            },
            {
                once:
                    true
            }
        );
    </script>
</body>

</html>
